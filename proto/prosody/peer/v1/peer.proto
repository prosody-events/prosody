syntax = "proto3";

package prosody.peer.v1;

// Operations prosody peers perform on each other. Later peer features add
// methods here rather than services of their own.
service PeerService {
  // Delivers one handler result to its target peer. The gRPC status reports
  // delivery. An empty response body cannot report a false success.
  rpc DeliverResult(DeliverResultRequest) returns (DeliverResultResponse);
}

// Prosody's retry classification for one handler failure.
enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_TRANSIENT = 1;
  ERROR_CATEGORY_PERMANENT = 2;
  ERROR_CATEGORY_TERMINAL = 3;
}

// A successful handler result encoded with the user's response codec.
message ResponseSuccess {
  bytes format = 1; // UTF-8 response `Codec::FORMAT_ID`
  bytes payload = 2;
}

// A handler failure encoded by Prosody.
message HandlerError {
  ErrorCategory category = 1;
  bytes message = 2; // UTF-8 display text
}

// One handler result, addressed to the peer that is waiting for it.
message DeliverResultRequest {
  // Which peer this frame is for. A peer that is not the target forwards the
  // frame or rejects it, and never accepts it.
  bytes target_peer = 1; // 16 bytes
  bytes request_id = 2; // 16 bytes
  bytes subsystem = 3; // UTF-8 subsystem name
  // Exactly one arm reports the handler result.
  oneof result {
    ResponseSuccess success = 4;
    HandlerError handler_error = 5;
  }
  // Empty until a relay forwards the frame, then the relay's own peer id. A
  // frame that already names a relay is never forwarded again. A relay always
  // sets this itself and never preserves a value it received.
  bytes relay_peer = 6; // 16 bytes, or empty
}

// The gRPC status reports the delivery result. A response has no fields.
message DeliverResultResponse {}
