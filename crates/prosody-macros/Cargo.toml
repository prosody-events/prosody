[package]
categories = ["asynchronous", "development-tools::procedural-macro-helpers"]
description = "Procedural macros for Prosody keyed-state collections"
documentation = "https://docs.rs/prosody-macros"
edition = "2024"
keywords = ["distributed-systems", "macros", "prosody"]
license = "MIT"
name = "prosody-macros"
publish = ["crates-io"]
readme = "README.md"
repository = "https://github.com/prosody-events/prosody"
version = "0.6.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["extra-traits", "full", "visit"] }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
