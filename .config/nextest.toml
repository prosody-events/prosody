[profile.default]
status-level = "pass"

# A hang backstop, never a performance gate.
#
# A test that blocks forever otherwise blocks the whole run: nextest reports it
# as slow and waits for it. One consumer test held a runner for 55 minutes this
# way, because a defect made a `spawn_blocking` poll loop immortal and the
# runtime drop then waited on it. A per-test deadline cannot catch that: the
# test already failed, and the process is what hangs.
#
# The period is generous, so a legitimately slow suite under cranked
# `QUICKCHECK_TESTS` or `INTEGRATION_TESTS` still finishes.
slow-timeout = { period = "60s", terminate-after = 15 }
