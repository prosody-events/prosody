[workspace]
# `default-members` makes bare `cargo clippy`, `cargo doc`, and `cargo nextest
# run` cover the macro crate. Without it, cargo builds and tests only the root
# package, so the member ships ungated.
default-members = [".", "crates/prosody-macros"]
members = ["crates/prosody-macros"]
resolver = "3"

[package]
categories = ["asynchronous", "network-programming"]
description = "Event sourcing library with persistent timers that isolates per-key failures"
edition = "2024"
keywords = [
    "distributed-systems",
    "kafka",
    "messaging",
    "opentelemetry",
    "tracing",
]
license = "MIT"
name = "prosody"
readme = "README.md"
repository = "https://github.com/prosody-events/prosody"
version = "0.5.0"

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
arc-swap = "1.8"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
axum-extra = { version = "0.12", features = ["routing"] }
base16ct = "1.0"
bytes = "1"
chrono = "0.4"
crc32fast = "1"
crossbeam-utils = "0.8"
derive_builder = "0.20"
dyn-clone = "1.0"
educe = "0.7"
fixedstr = { version = "0.5", features = ["flex-str"] }
# fjall 3.x: a `Database` holds many `Keyspace`s (each its own LSM-tree), with
# synchronous `insert`/`get`/`range` wrapped in `spawn_blocking` at each call
# site and multi-cell settle writes batched through one atomic `OwnedWriteBatch`.
fjall = "3.1"
futures = "0.3"
humantime = "2.3"
internment = "0.8"
intervallum = "1.4"
itoa = "1"
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
nohash-hasher = "0.2"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", features = [
    "grpc-tonic",
    "http-json",
    "http-proto",
] }
opentelemetry-semantic-conventions = { version = "0.32", features = [
    "semconv_experimental",
] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
parking_lot = { version = "0.12", features = ["hardware-lock-elision"] }
parse-size = "1.1"
paste = "1.0"
pin-project = "1.1"
portable-atomic = { version = "1.3", features = ["float"] }
prosody-macros = { version = "0.5.0", path = "crates/prosody-macros" }
prost = "0.14.4"
quanta = "0.12"
quick_cache = "0.7"
rand = "0.10"
# SAFETY-AUDIT: src/consumer/decode.rs uses `unsafe { payload_mut() }` whose
# soundness argument is pinned to rdkafka 0.39.x. Re-audit on any bump.
rdkafka = { version = "0.39", features = ["tracing"] }
rmp-serde = "1"
rust-embed = { version = "8.11", features = ["include-exclude"] }
scc = "3.6"
scylla = { version = "1.5", features = ["chrono-04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
smallvec = { version = "1.15", features = ["const_generics", "union"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.50", features = ["macros", "parking_lot", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["time"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "parking_lot",
] }
uuid = { version = "1.23", features = ["v4", "v5", "v7", "v8"] }
validator = { version = "0.21", features = ["derive"] }
whoami = "2.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["experimental"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[features]
default = ["cmake-build"]

# Build system
cmake-build = ["rdkafka/cmake-build"]

# Linking
dynamic-linking = ["rdkafka/dynamic-linking"]
static-linking = ["rdkafka/static-linking"]

# SSL/TLS
ssl = ["rdkafka/ssl"]
ssl-vendored = ["rdkafka/ssl-vendored"]

# SASL/GSSAPI authentication
gssapi = ["rdkafka/gssapi"]
gssapi-vendored = ["rdkafka/gssapi-vendored"]
sasl = ["rdkafka/sasl"]

# HTTP client (for schema registry, etc.)
curl = ["rdkafka/curl"]
curl-static = ["rdkafka/curl-static"]

# Compression
external-lz4 = ["rdkafka/external-lz4"]
libz-static = ["rdkafka/libz-static"]
zstd = ["rdkafka/zstd"]
zstd-pkg-config = ["rdkafka/zstd-pkg-config"]

[target.'cfg(not(target_arch = "arm"))'.dependencies]
simd-json = { version = "0.17", features = ["serde_impl"] }

[dev-dependencies]
alloc_count = "0.3.1"
color-eyre = "0.6"
derive-quickcheck-arbitrary = "0.1"
itertools = "0.15"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
prost-types = "0.14.4"
quickcheck = "1.0"
quickcheck_macros = "1.1"
reqwest = "0.13"
slotmap = "1.1"
tempfile = "3"
tokio = { version = "1.44", features = ["rt-multi-thread", "test-util"] }
uuid = { version = "1.16", features = ["v4"] }

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "fat"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
blocks_in_conditions = "allow"
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
create_dir = "warn"
dbg_macro = "warn"
default_numeric_fallback = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "deny"
format_push_string = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
implicit_clone = "warn"
large_futures = "warn"
missing_assert_message = "warn"
module_name_repetitions = "allow"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_outside_block = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unwrap_used = "deny"
verbose_file_reads = "warn"
