name: Check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore planning evidence
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Create the evidence directory
        run: mkdir -p target/planning-evidence
      - name: Plan affected work
        id: rail
        uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
        with:
          evidence: target/planning-evidence

  # A separate job records evidence on every push. The routed jobs can skip, and their RUSTFLAGS would not match the plan jobs.
  evidence:
    name: Planning evidence
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: loadingalias/cargo-rail-action/setup@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
      # Do not record cargo.clippy, cargo.doc, or cargo.doctest: Cargo-Rail 0.30.1 has no complete evidence for them.
      # Their jobs route on cargo.build and cargo.test instead, because that evidence covers the same compiler inputs.
      - name: Record build evidence
        run: >
          cargo rail plan evidence --work cargo.build
          --output target/planning-evidence/cargo.build.json
          -- build --locked --workspace
      - name: Record test evidence
        run: >
          cargo rail plan evidence --work cargo.test
          --output target/planning-evidence/cargo.test.json
          -- test --locked --workspace --no-run
      - name: Save planning evidence
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  test:
    name: Tests
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'nextest') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - "9094:9094"
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
      cassandra:
        # The Docker official image, from ECR Public: no Docker Hub pull limit.
        image: public.ecr.aws/docker/library/cassandra:latest
        ports:
          - "9042:9042"
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local;'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true
      - name: Run tests
        run: cargo nextest run
        env:
          PROSODY_BOOTSTRAP_SERVERS: localhost:9094

  doctests:
    name: Doctests
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run doctests
        run: cargo test --doc --workspace

  fmt:
    name: Format
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'taplo') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'nextest') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install taplo from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: taplo-cli
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust formatting
        run: cargo fmt --check
      - name: Enforce TOML formatting
        run: taplo fmt --check

  dependencies:
    name: Dependencies
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install udeps from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-udeps
      - name: Run cargo udeps
        run: cargo +nightly udeps

  docs:
    name: Documentation
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc
