name: Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Rerun periodically to pick up new advisories
  schedule:
    - cron: '0 0 * * *'
  # Run manually
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.rail.outputs.build }}
      infra: ${{ steps.rail.outputs.infra }}
      test: ${{ steps.rail.outputs.test }}
    steps:
      - uses: actions/checkout@v6
      - name: Plan affected work
        id: rail
        uses: loadingalias/cargo-rail-action@ebc8ef2740efefe2cd5c42826344a8f1213113ae # v6
        with:
          since: ${{ github.event_name == 'push' && github.event.before || '' }}

  clippy:
    name: Clippy
    needs: plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.plan.outputs.build == 'true' || needs.plan.outputs.test == 'true' || needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install clippy-sarif from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: clippy-sarif
      - name: Install sarif-fmt from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sarif-fmt
      - uses: Swatinem/rust-cache@v2
      - name: Linting
        run: cargo clippy -- -D warnings
      - name: Linting (tests)
        run: cargo clippy --tests -- -D warnings
