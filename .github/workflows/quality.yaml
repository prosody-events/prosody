name: Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Rerun periodically to pick up new advisories
  schedule:
    - cron: '0 0 * * *'
  # Run manually
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v6
      - name: Plan affected work
        id: rail
        uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
        with:
          since: ${{ github.event_name == 'push' && github.event.before || '' }}

  clippy:
    name: Clippy
    needs: plan
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.clippy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install clippy-sarif from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: clippy-sarif
      - name: Install sarif-fmt from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sarif-fmt
      - uses: Swatinem/rust-cache@v2
      - name: Linting
        run: cargo clippy -- -D warnings
      - name: Linting (tests)
        run: cargo clippy --tests -- -D warnings
