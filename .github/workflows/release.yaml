name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_version:
        description: Publish an existing release tag with this workflow, without running Release Please
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_context.outputs.release_created }}
      ref: ${{ steps.release_context.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - name: Release Please Action
        if: inputs.retry_version == ''
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release context
        id: release_context
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          if [[ -n "$RETRY_VERSION" ]]; then
            ref="refs/tags/prosody-v$RETRY_VERSION"
            if ! git ls-remote --exit-code --tags origin "$ref" >/dev/null; then
              echo "::error::Release tag $ref does not exist"
              exit 1
            fi
            release_created=true
          else
            ref=
            release_created=${RELEASE_CREATED:-false}
          fi

          echo "release_created=$release_created" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.ref }}
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify linked crate versions
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          prosody_version="$(
            jq -r '
              .packages[]
              | select(.name == "prosody")
              | .version
            ' <<<"$metadata"
          )"
          macros_version="$(
            jq -r '
              .packages[]
              | select(.name == "prosody-macros")
              | .version
            ' <<<"$metadata"
          )"
          macros_requirement="$(
            jq -r '
              .packages[]
              | select(.name == "prosody")
              | .dependencies[]
              | select(.name == "prosody-macros")
              | .req
            ' <<<"$metadata"
          )"
          if [[ "$prosody_version" != "$macros_version" ]]; then
            echo "prosody $prosody_version and prosody-macros $macros_version must match." >&2
            exit 1
          fi
          if [[ "$macros_requirement" != "^$macros_version" ]]; then
            echo "prosody requires prosody-macros $macros_requirement, not ^$macros_version." >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish prosody-macros
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody-macros") | .version')"
          if cargo info "prosody-macros@$version" --registry crates-io >/dev/null 2>&1; then
            echo "prosody-macros $version is already available."
            exit 0
          fi
          if cargo publish -p prosody-macros; then
            exit 0
          fi
          cargo info "prosody-macros@$version" --registry crates-io >/dev/null
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for prosody-macros
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody-macros") | .version')"
          for attempt in {1..30}; do
            if cargo info "prosody-macros@$version" --registry crates-io >/dev/null; then
              exit 0
            fi
            echo "prosody-macros $version is not available. Attempt $attempt of 30."
            sleep 10
          done
          echo "prosody-macros $version is not available after 30 attempts." >&2
          exit 1
      - name: Publish prosody
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody") | .version')"
          if cargo info "prosody@$version" --registry crates-io >/dev/null 2>&1; then
            echo "prosody $version is already available."
            exit 0
          fi
          cargo publish -p prosody
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
