name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Force release version (e.g. 1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Release Please Action
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.release_as }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: cmake libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify linked crate versions
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          prosody_version="$(
            jq -r '
              .packages[]
              | select(.name == "prosody")
              | .version
            ' <<<"$metadata"
          )"
          macros_version="$(
            jq -r '
              .packages[]
              | select(.name == "prosody-macros")
              | .version
            ' <<<"$metadata"
          )"
          macros_requirement="$(
            jq -r '
              .packages[]
              | select(.name == "prosody")
              | .dependencies[]
              | select(.name == "prosody-macros")
              | .req
            ' <<<"$metadata"
          )"
          if [[ "$prosody_version" != "$macros_version" ]]; then
            echo "prosody $prosody_version and prosody-macros $macros_version must match." >&2
            exit 1
          fi
          if [[ "$macros_requirement" != "^$macros_version" ]]; then
            echo "prosody requires prosody-macros $macros_requirement, not ^$macros_version." >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish prosody-macros
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody-macros") | .version')"
          if cargo info "prosody-macros@$version" --registry crates-io >/dev/null 2>&1; then
            echo "prosody-macros $version is already available."
            exit 0
          fi
          if cargo publish -p prosody-macros; then
            exit 0
          fi
          cargo info "prosody-macros@$version" --registry crates-io >/dev/null
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for prosody-macros
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody-macros") | .version')"
          for attempt in {1..30}; do
            if cargo info "prosody-macros@$version" --registry crates-io >/dev/null; then
              exit 0
            fi
            echo "prosody-macros $version is not available. Attempt $attempt of 30."
            sleep 10
          done
          echo "prosody-macros $version is not available after 30 attempts." >&2
          exit 1
      - name: Publish prosody
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prosody") | .version')"
          if cargo info "prosody@$version" --registry crates-io >/dev/null 2>&1; then
            echo "prosody $version is already available."
            exit 0
          fi
          cargo publish -p prosody
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
